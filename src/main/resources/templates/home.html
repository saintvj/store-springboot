<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CSG Store</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="home-page">

<!-- ================= HEADER ================= -->
<header class="navbar glass fixed-header">
    <div class="left">
        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>

    <div class="center">
        <h1>CSG Store</h1>
    </div>

    <div class="right"></div>
</header>


<!-- MOBILE CATEGORY STRIP -->
<div class="mobile-categories">
    <span th:each="c : ${T(com.vedant.store.model.Category).values()}"
          th:text="${#strings.replace(c.name(),'_',' ')}"
          th:data-cat="${c.name()}"
          onclick="scrollFromData(this)">
    </span>
</div>




<!-- ================= CATEGORY SIDEBAR ================= -->
<aside class="category-sidebar glass">
    <h3>Categories</h3>
    <ul>
        <li th:each="c : ${T(com.vedant.store.model.Category).values()}"
            th:text="${#strings.replace(c.name(),'_',' ')}"
            th:data-cat="${c.name()}"
            onclick="scrollFromData(this)">
        </li>


    </ul>
</aside>

<!-- ================= PRODUCT SCROLL ================= -->
<main class="product-scroll">

    <section th:each="c : ${T(com.vedant.store.model.Category).values()}"
             th:id="${c.name()}">

        <h2 th:text="${#strings.replace(c.name(),'_',' ')}"></h2>

        <div class="grid">
            <div class="product-card glass"
                 th:each="p : ${products}"
                 th:if="${p.category == c}">

                <img th:src="'https://source.unsplash.com/400x300/?' + ${product.category.name().toLowerCase()}"
                     alt="Snack image">


                <h3 th:text="${p.name}"></h3>

                <span>₹ <span th:text="${p.price}"></span></span>

                <a th:href="@{/product/{id}(id=${p.id})}" class="btn">
                    View / Order
                </a>
            </div>
        </div>
    </section>

</main>

<!-- ================= CART DRAWER ================= -->
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3>Your Cart</h3>
        <button onclick="toggleCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">
        <button class="btn" onclick="placeOrderOnWhatsApp()">
            Order on WhatsApp
        </button>

        <a href="/login" class="btn secondary" style="margin-top:10px;">
            Admin Login
        </a>
    </div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/home.js"></script>
<script src="/js/cart.js"></script>

<div class="cart-fab floating" onclick="toggleCart()">
    🛒 <span id="cartCount">0</span>
</div>

</body>
</html>
