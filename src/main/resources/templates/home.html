<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CSG Store</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="navbar glass fixed-header">
    <div></div>
    <div class="center"><h1>CSG Store</h1></div>
    <div class="right">
        <button id="themeToggle" class="theme-btn">🌙</button>
        <a href="/login">Admin</a>
    </div>
</header>

<aside class="category-sidebar glass">
    <h3>Categories</h3>
    <ul id="categoryList">
        <li data-cat="FARSAN" onclick="scrollToCategory('FARSAN')">Farsan</li>
        <li data-cat="CHIWADA" onclick="scrollToCategory('CHIWADA')">Chiwada</li>
        <li data-cat="FASTING_SPECIAL" onclick="scrollToCategory('FASTING_SPECIAL')">Fasting Special</li>
        <li data-cat="CHAKALI" onclick="scrollToCategory('CHAKALI')">Chakali</li>
        <li data-cat="SHEV" onclick="scrollToCategory('SHEV')">Shev</li>
        <li data-cat="DAL" onclick="scrollToCategory('DAL')">Dal</li>
        <li data-cat="NUTS" onclick="scrollToCategory('NUTS')">Nuts</li>
    </ul>
</aside>

<main class="product-scroll" id="productScroll">

    <section th:each="category : ${T(com.vedant.store.model.Category).values()}"
             th:id="${category.name()}"
             class="category-section">

        <div class="category-header">
            <h2 th:text="${category}"></h2>
            <button class="toggle-btn" onclick="toggleCategory(this)">⌄</button>
        </div>

        <div class="grid category-content">
            <div class="product-card glass"
                 th:each="product : ${products}"
                 th:if="${product.category == category}">
                <img src="https://images.unsplash.com/photo-1604909052743-94e838986d24">
                <h3 th:text="${product.name}"></h3>
                <div class="badge" th:text="${product.category}"></div>
                <span>₹ <span th:text="${product.price}"></span></span>
                <a th:href="@{/product/{id}(id=${product.id})}" class="btn">
                    View / Order
                </a>
            </div>
        </div>
    </section>

    <footer class="glass full-footer">
        <p><strong>CSG Store</strong></p>
        <p>Orders via WhatsApp only</p>
    </footer>

</main>

<script src="/js/theme.js"></script>
<script src="/js/home.js"></script>

</body>
</html>
