<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CSG Store</title>
</head>
<body>

<h1> CSG Store</h1>
<p>Fresh snacks from our local store</p>

<hr>

<div th:each="product : ${products}">
    <h3 th:text="${product.name}">Product Name</h3>
    <p>₹<span th:text="${product.price}">0</span></p>

    <a th:href="@{/product/{id}(id=${product.id})}">
        View / Order
    </a>

    <hr>
</div>

</body>
</html>
