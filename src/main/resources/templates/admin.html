<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel | CSG Store</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="admin-page">

<header class="glass navbar">
    <h2>Admin Panel – Manage Products</h2>
    <div>
        <button id="themeToggle" class="theme-btn">🌙</button>
        <a href="/" class="btn">View Store</a>
        <a href="/logout" class="btn danger">Logout</a>
    </div>
</header>

<div class="admin-wrapper">

    <!-- ADD PRODUCT -->
    <div class="admin-card glass">
        <h3>Add / Edit Product</h3>

        <form th:action="@{/admin/add}" th:object="${productRequest}" method="post">
            <input type="hidden" name="id" th:value="${productId}">

            <label>Product Name</label>
            <input type="text" th:field="*{name}" required>

            <label>Price (₹ / kg)</label>
            <input type="number" th:field="*{price}" required>

            <label>Category</label>
            <select th:field="*{category}" required>
                <option value="FARSAN">Farsan</option>
                <option value="CHIWADA">Chiwada</option>
                <option value="FASTING_SPECIAL">Fasting Special</option>
                <option value="CHAKALI">Chakali</option>
                <option value="SHEV">Shev</option>
                <option value="DAL">Dal</option>
                <option value="ALL_TIME_FAVOURITE">All-time Favourite</option>
                <option value="NUTS">Nuts</option>
            </select>

            <button class="btn primary">Save</button>
        </form>
    </div>

    <!-- PRODUCT TABLE -->
    <div class="admin-card glass">
        <h3>Existing Products</h3>

        <table class="admin-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.category}"></td>
                <td th:text="${product.price}"></td>
                <td>
                    <a th:href="@{/admin/edit/{id}(id=${product.id})}" class="btn small">Edit</a>
                    <a th:href="@{/admin/delete/{id}(id=${product.id})}" class="btn small danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<footer class="glass">
    <p>CSG Store Admin</p>
</footer>

<script src="/js/theme.js"></script>
</body>
</html>
