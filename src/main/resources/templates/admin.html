<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="glass">
    <h2>Admin Panel – Manage Products</h2>
    <a href="/" class="btn">View Store</a>
    <a href="/logout" class="btn danger">Logout</a>
</header>

<div class="admin-wrapper">

    <!-- ================= ADD / EDIT FORM ================= -->
    <div class="admin-card glass">

        <h3 th:text="${productId != null ? 'Edit Product' : 'Add New Product'}">
            Add New Product
        </h3>

        <form th:action="@{/admin/add}"
              th:object="${productRequest}"
              method="post">

            <!-- Hidden ID for edit -->
            <input type="hidden" name="id" th:value="${productId}" />

            <label>Product Name</label>
            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter product name"
                   required />

            <div class="error"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>

            <br>

            <label>Price (₹ per kg)</label>
            <input type="number"
                   th:field="*{price}"
                   placeholder="Enter price per kg"
                   required />

            <div class="error"
                 th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}"></div>

            <br>

            <button type="submit" class="btn primary">
                <span th:text="${productId != null ? 'Update Product' : 'Add Product'}">
                    Add Product
                </span>
            </button>

        </form>
    </div>

    <!-- ================= PRODUCT LIST ================= -->
    <div class="admin-card glass">

        <h3>Existing Products</h3>

        <table class="admin-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Price (₹/kg)</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Name</td>
                <td th:text="${product.price}">Price</td>
                <td>
                    <a th:href="@{/admin/edit/{id}(id=${product.id})}" class="btn small">
                        Edit
                    </a>
                    <a th:href="@{/admin/delete/{id}(id=${product.id})}"
                       class="btn small danger"
                       onclick="return confirm('Delete this product?')">
                        Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

</div>

<footer class="glass">
    <p><strong>CSG Store Admin</strong></p>
    <p>Manage products easily</p>
</footer>

</body>
</html>
