<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name}">Product</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="product-page">

<header class="navbar glass fixed-header">
    <div></div>
    <div class="center"><h1>CSG Store</h1></div>
    <div class="right">
        <button id="themeToggle" class="theme-btn">🌙</button>
        <div class="cart-fab" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<main class="detail-wrapper">
    <div class="detail-card glass"
         id="productCard"
         th:data-id="${product.id}"
         th:data-name="${product.name}"
         th:data-price="${product.price}"
         th:data-category="${product.category}">

        <img src="https://images.unsplash.com/photo-1604909052743-94e838986d24">

        <h2 th:text="${product.name}"></h2>

        <p class="price">₹ <span th:text="${product.price}"></span> / kg</p>

        <select class="qty" id="qty">
            <option value="500">500 g</option>
            <option value="1000" selected>1 kg</option>
            <option value="1500">1.5 kg</option>
            <option value="2000">2 kg</option>
            <option value="2500">2.5 kg</option>
        </select>

        <div class="btn-group">
            <button id="addToCartBtn" class="btn">Add to Cart</button>

            <button id="removeFromCartBtn"
                    class="btn secondary"
                    style="display:none">
                Remove from Cart
            </button>

            <a href="/" class="btn secondary">Add more items</a>
        </div>
    </div>
</main>

<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3>Your Cart</h3>
        <button onclick="toggleCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">
        <button class="btn" onclick="placeOrderOnWhatsApp()">
            Order on WhatsApp
        </button>
    </div>
</div>

<div id="toast" class="toast">Added to cart 🛒</div>

<script src="/js/theme.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
