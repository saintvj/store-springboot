<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name}">Product</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="detail-wrapper">
    <div class="detail-card glass">

        <img src="https://images.unsplash.com/photo-1604909052743-94e838986d24"
             alt="Product image">

        <h2 th:text="${product.name}">Product Name</h2>

        <p>
            <strong>
                ₹ <span th:text="${product.price}">0</span> / kg
            </strong>
        </p>

        <!-- Quantity -->
        <label for="qty"><strong>Select Quantity</strong></label>
        <select class="qty" id="qty">
            <option value="100">100 g</option>
            <option value="200">200 g</option>
            <option value="250">250 g</option>
            <option value="500">500 g</option>
            <option value="1000" selected>1 kg</option>
            <option value="2000">2 kg</option>
            <option value="3000">3 kg</option>
            <option value="4000">4 kg</option>
        </select>

        <!-- Order -->
        <a id="orderBtn"
           class="btn"
           th:href="@{/order/{id}(id=${product.id}, qty=1000)}">
            Order on WhatsApp
        </a>

        <a href="/" class="back-link">← Back to Store</a>
    </div>
</div>

<footer class="glass">
    <p><strong>CSG Store</strong></p>
    <p>Kherdi Malewadi, Chiplun</p>
    <p>Phone / WhatsApp: +91 98765 43210</p>
    <p>Orders via WhatsApp only</p>
</footer>

<script>
    const qtySelect = document.getElementById("qty");
    const orderBtn = document.getElementById("orderBtn");

    qtySelect.addEventListener("change", () => {
        const qty = qtySelect.value;
        const baseUrl = orderBtn.getAttribute("href").split("?")[0];
        orderBtn.setAttribute("href", baseUrl + "?qty=" + qty);
    });
</script>

</body>
</html>
